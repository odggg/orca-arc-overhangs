name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag to release (e.g. v0.4.2)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-and-release:
    name: Build universal wheel and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check automatic publishing setup
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo 'Add the RELEASE_TOKEN repository secret with Contents read/write access to this repository.' >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if response=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>&1); then
            echo 'This tag already has a release. Choose a new version.' >&2
            exit 1
          elif [[ "$response" != *"(HTTP 404)"* ]]; then
            echo 'Could not check existing releases. Nothing will be published.' >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build and run regression suite
        run: |
          python build_plugin.py
          python -m unittest discover -s tests -p test_orcacloud_publish.py -v
          python -m unittest discover -s tests -p test_stage_release.py -v
          python -m unittest discover -s tests -p test_slice_preview.py -v
          python -m unittest discover -s tests -p test_preview_playback.py -v
          python -m unittest discover -s tests -p test_workbench.py -v
          python tests.py
          python test_audit.py
          node test_tab.js
          python package_release.py
          python test_package.py

      - name: Stage only the verified universal wheel
        run: python scripts/stage_release.py --tag "$RELEASE_TAG"

      # Finish uploading before publishing so OrcaCloud cannot see an empty release.
      - name: Create release draft
        id: draft
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          draft: true
          prerelease: false

      # A separate token is required to trigger the release-event OIDC workflow.
      - name: Publish completed release and trigger OrcaCloud
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: python scripts/publish_github_release.py --tag "$RELEASE_TAG" --release-id "$RELEASE_ID"
