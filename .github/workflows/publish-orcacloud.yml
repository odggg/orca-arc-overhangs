name: Publish to OrcaCloud

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable GitHub release tag to validate (no upload)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: orcacloud-publishing
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate existing release without uploading
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/publish_orcacloud.py --tag "$RELEASE_TAG" --dry-run

  publish:
    if: github.event_name == 'release' && !github.event.release.prerelease
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish exact universal release asset
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/publish_orcacloud.py --tag "$RELEASE_TAG"
